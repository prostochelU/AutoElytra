plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.addon'

repositories {
    mavenCentral()
    maven { url = "https://fabricmc.net" }
    maven { url = "https://jitpack.io" } // Используем JitPack как основной источник
}

dependencies {
    // Настройки под Minecraft 1.21.1
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.2:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"

    // Обязательный Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.1"
    
    // Стабильное подключение Meteor Client через JitPack
    modImplementation "com.github.MeteorDevelopment:meteor-client:main-SNAPSHOT"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
